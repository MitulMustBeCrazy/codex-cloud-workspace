<!doctype html>
<html lang="en" data-astryx-theme="neutral">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Astryx Live | Isolated Component Specimen</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@astryxdesign/core@0.7.17/reset.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@astryxdesign/core@0.7.17/astryx.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@astryxdesign/theme-neutral@0.7.17/theme.css">
<style>body{font-family:system-ui,-apple-system,sans-serif;background:#f6f6f4;color:#292929;margin:0;padding:26px}.specimen{max-width:600px;margin:auto}.meta{font-size:11px;letter-spacing:.13em;font-weight:700;color:#8c5552}#status{margin-top:15px;min-height:20px;font-size:13px;color:#656565}a{color:#a13e46}#error{color:#a13e46;line-height:1.55;font-size:13px}.hint{font-size:13px;color:#7b7b7b;margin-top:16px}</style>
<script type="importmap">
{"imports":{"react":"https://esm.sh/react@19.2.0","react/jsx-runtime":"https://esm.sh/react@19.2.0/jsx-runtime","react-dom":"https://esm.sh/react-dom@19.2.0","react-dom/client":"https://esm.sh/react-dom@19.2.0/client","@astryxdesign/core":"https://esm.sh/@astryxdesign/core@0.7.17?external=react,react-dom"}}
</script>
</head>
<body>
<section class="specimen">
<p class="meta">UPSTREAM EXECUTION / META ASTRYX 0.7.17</p>
<div id="root"><p>Loading the published Astryx component bundle…</p></div>
<p id="status" role="status" aria-live="polite"></p>
<p class="hint">Actual published Astryx components, isolated from the Quiet Canvas application in an iframe. Requires access to external CDNs.</p>
<noscript>JavaScript is required for this live specimen.</noscript>
</section>
<script type="module">
try {
 const React=await import("react");
 const {createRoot}=await import("react-dom/client");
 const {Card,Stack,Heading,Text,Button}=await import("@astryxdesign/core");
 const e=React.createElement;
 function Demo(){
  const [count,setCount]=React.useState(0);
  return e(Card,{maxWidth:530,elevation:"low"},e(Stack,{gap:3,align:"start",padding:4},
   e(Heading,{level:2},"Actual Astryx components"),
   e(Text,null,"A published Card, Stack, Heading, Text and Button rendered inside an isolated live preview."),
   e(Button,{variant:"primary",label:"Increment count",onPress:()=>setCount(c=>c+1),onClick:()=>setCount(c=>c+1)}),
   e(Text,null,"Interactions: "+count)));
 }
 createRoot(document.getElementById("root")).render(e(Demo));
 document.getElementById("status").textContent="Upstream bundle loaded.";
}catch(error){
 document.getElementById("root").innerHTML='<p id="error">Astryx could not load from the public CDN. Open the upstream Storybook or inspect the integration documentation.</p>';
 document.getElementById("status").textContent=String(error&&error.message||error);
}
</script>
</body>
</html>
